name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the website
        run: pnpm build
        env:
          # Recorded prices for 28 Oct 2026, so tests and screenshots don't depend on the day.
          WATTSLOT_PRICES_DIR: e2e/fixtures/prices
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter @wattslot/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @wattslot/web e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
      - name: Lighthouse (SEO, accessibility and best practices stay at 100)
        working-directory: apps/web
        run: CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" pnpm lighthouse
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          # The folder starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 7
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- packages/db/migrations)" || {
            echo "::error::packages/db/schema changed without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain -- packages/db/migrations
            exit 1
          }
